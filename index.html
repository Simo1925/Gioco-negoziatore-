<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Che negoziatore sei?</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#161616;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:22px 18px 65px}header{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #111;padding:16px 0;margin-bottom:30px;font-size:12px;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(38px,7vw,62px);line-height:1.07;letter-spacing:-.05em}h2{font-size:30px}p{line-height:1.6;color:#444}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.panel{background:#fff;border:1px solid #ddd;padding:clamp(20px,5vw,35px);margin-top:24px}.choices{display:grid;gap:12px;margin:24px 0}button{font:inherit;cursor:pointer}.choice{width:100%;background:white;border:1px solid #bbb;padding:18px;text-align:left;line-height:1.5}.choice:hover,.choice:focus-visible{border:2px solid #111;padding:17px}.primary{width:100%;background:#111;color:#fff;border:2px solid #111;padding:17px;font-weight:700;margin-top:18px}.primary:disabled{background:#999;border-color:#999}.split{display:flex;justify-content:space-between;font-weight:700;gap:15px}.split span:last-child{text-align:right}input[type=range]{width:100%;accent-color:#111;margin:28px 0}.feedback{border-left:4px solid #111;background:#eae8e3;padding:18px;margin:20px 0}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}.bar{height:4px;background:#ddd;margin:20px 0 30px}.bar div{height:100%;background:#111}.tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}footer{font-size:12px;color:#777;margin-top:50px}a{color:inherit}</style></head><body><main><header><strong>Essere Commerciale Oggi</strong><span>Un gioco sulla negoziazione</span></header><div id="app"></div><footer>Un esercizio di riflessione, non un test psicometrico validato. Nessuna registrazione richiesta.</footer></main><script>
'use strict';
const dims=['Tutela','Indagine','Scambio','Collaborazione','Esecuzione'];
const profiles={Tutela:['Il Custode del valore','Sai difendere confini e sostenibilità economica.','Una posizione troppo rigida può limitare il confronto.','Non avere fretta'],Indagine:['L’Esploratore','Fai emergere informazioni e interessi nascosti.','L’analisi può rallentare la decisione.','L’oracolo sa tutto. Ma chi decide cosa chiedere?'],Scambio:['L’Architetto degli accordi','Cerchi contropartite e vantaggi reciproci.','La ricerca di un accordo può farti trascurare le emozioni.','Il potere di ripensare'],Collaborazione:['Il Costruttore di fiducia','Coinvolgi le persone e investi nella relazione.','Potresti concedere troppo per mantenere l’armonia.','Fermarsi per Andare Avanti'],Esecuzione:['Il Decisore','Trasformi il dialogo in azioni concrete.','La rapidità può farti trascurare elementi ancora aperti.','Come Utilizzo il CRM']};
const rounds=[{title:'Il cliente ha un’offerta più bassa',story:'Un cliente B2B ti dice: «Il concorrente costa il 12% in meno. Se non ti adegui, cambiamo fornitore». Come rispondi?',opts:[['Tutela','Spiego il valore della proposta e mantengo il prezzo.','Hai protetto il margine, ma il cliente vuole maggiori prove del valore.'],['Indagine','Chiedo quali condizioni comprende l’offerta alternativa.','Scopri che il concorrente offre tempi di consegna meno affidabili.'],['Scambio','Valuto uno sconto in cambio di un impegno sui volumi.','Il cliente considera un accordo, ma vuole flessibilità.'],['Collaborazione','Propongo un confronto per chiarire le priorità comuni.','Il dialogo si riapre e viene coinvolto il responsabile tecnico.'],['Esecuzione','Propongo una soluzione temporanea con una scadenza precisa.','La trattativa avanza, ma alcuni dettagli restano aperti.']]},{title:'Un imprevisto tecnico',story:'Il team tecnico segnala un possibile aumento dei costi e dei tempi. Il cliente vuole una conferma entro domani.',opts:[['Tutela','Comunico i vincoli e confermo solo condizioni sostenibili.','Eviti promesse rischiose, ma il cliente chiede alternative.'],['Indagine','Raccolgo i dati mancanti e verifico la natura del rischio.','Individui il componente che causa il problema.'],['Scambio','Offro consegne per fasi in cambio di condizioni riviste.','Si apre una soluzione con benefici reciproci.'],['Collaborazione','Riunisco cliente e tecnici per costruire un piano comune.','Le parti condividono i vincoli e stabiliscono una priorità.'],['Esecuzione','Definisco un piano provvisorio e una data di conferma.','Il cliente ha una direzione immediata, da verificare.']]},{title:'Il silenzio dopo l’offerta',story:'Hai inviato una proposta importante. Il cliente sembrava interessato, ma da tre settimane non risponde.',opts:[['Tutela','Ribadisco la validità dell’offerta e chiedo una decisione.','Hai chiarito i confini, anche se il cliente potrebbe non essere pronto.'],['Indagine','Cerco di capire quali ostacoli rallentano la decisione.','Emerge che il progetto non ha ancora il budget approvato.'],['Scambio','Propongo un piccolo impegno reciproco per proseguire.','Il cliente condivide un calendario decisionale.'],['Collaborazione','Condivido un contenuto utile senza chiedere una risposta.','Mantieni la relazione aperta e il cliente torna a coinvolgerti.'],['Esecuzione','Propongo una chiamata con due date e un obiettivo preciso.','La richiesta concreta facilita la definizione del prossimo passo.']]}];
let step=0,margin=null,answers=[],orders=[],chosen=null;
const app=document.getElementById('app');function E(t,s,c){let e=document.createElement(t);if(s!==undefined)e.textContent=s;if(c)e.className=c;return e}function btn(s,f,c='primary'){let b=E('button',s,c);b.onclick=f;return b}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function reset(){step=0;margin=null;answers=[];chosen=null;orders=rounds.map(r=>shuffle(r.opts));render()}function advance(){step++;chosen=null;render();window.scrollTo(0,0)}function base(k,title,desc){app.replaceChildren(E('div',k,'eyebrow'),E('h1',title),E('p',desc));let bar=E('div',undefined,'bar'),fill=E('div');fill.style.width=(step/5*100)+'%';bar.append(fill);app.append(bar)}function render(){if(step===0){base('Esperienza interattiva · 4 decisioni','Che negoziatore sei?','Un cliente difficile, un imprevisto tecnico e una trattativa ferma. Scopri quali priorità guidano le tue decisioni. Nessuna risposta è giusta in assoluto.');app.append(btn('Inizia il gioco',advance));return}if(step===1){base('Fase 1 di 4 · Le tue priorità','Distribuisci 100 punti','Quanto investi nella tutela del margine e quanto nella relazione con il cliente?');let p=E('section',undefined,'panel'),s=E('div',undefined,'split'),a=E('span','Margine: —'),b=E('span','Relazione: —');s.append(a,b);let input=E('input');input.type='range';input.min=0;input.max=100;input.step=5;input.value=50;input.setAttribute('aria-label','Punti dedicati al margine');let hint=E('p','Sposta il cursore per scegliere. Non c’è un valore preselezionato.'),go=btn('Conferma',advance);go.disabled=true;input.oninput=()=>{margin=Number(input.value);a.textContent='Margine: '+margin;b.textContent='Relazione: '+(100-margin);hint.textContent='Hai distribuito tutti i 100 punti.';go.disabled=false};p.append(s,input,hint,go);app.append(p);return}if(step>=2&&step<=4){let idx=step-2,r=rounds[idx];base('Scenario '+(idx+1)+' di 3',r.title,r.story);if(chosen===null){let list=E('div',undefined,'choices');orders[idx].forEach(o=>list.append(btn(o[1],()=>{answers[idx]=o[0];chosen=o;render()},'choice')));app.append(list)}else{let f=E('div',undefined,'feedback');f.append(E('strong','La conseguenza della tua scelta'),E('p',chosen[2]));app.append(f,btn(idx===2?'Scopri il tuo profilo':'Prosegui',advance))}return}let scores=Object.fromEntries(dims.map(d=>[d,0]));answers.forEach(d=>scores[d]+=2);if(margin<=45)scores.Collaborazione++;else if(margin>=55)scores.Tutela++;let top=Math.max(...Object.values(scores)),tied=dims.filter(d=>scores[d]===top),primary=tied.length===1?tied[0]:[...answers].reverse().find(d=>tied.includes(d))||tied[0],other=tied.filter(d=>d!==primary);base('Il risultato','Il tuo stile di negoziazione','Le tue scelte descrivono una tendenza in questi scenari, non un’etichetta definitiva.');let p=E('section',undefined,'panel');p.append(E('span',other.length?'Profilo misto':'Profilo prevalente','tag'),E('h2',profiles[primary][0]));if(other.length)p.append(E('p','Con una componente di: '+other.map(d=>profiles[d][0]).join(', ')));p.append(E('p','Punto di forza: '+profiles[primary][1]),E('p','Attenzione a: '+profiles[primary][2]),E('h3','Punteggi'));dims.forEach(d=>{let row=E('div',undefined,'row');row.append(E('span',d),E('strong',String(scores[d])));p.append(row)});p.append(E('h3','Da leggere sul blog'),E('p',profiles[primary][3]));let a=E('a','Visita Essere Commerciale Oggi');a.href='https://simonebblogblog.wordpress.com/';a.target='_blank';a.rel='noopener';p.append(a);const resultText='Il mio profilo di negoziazione è: '+profiles[primary][0]+(other.length?' (con una componente di '+other.map(d=>profiles[d][0]).join(', ')+')':'')+'. Ho scoperto il mio stile con «Che negoziatore sei?». Prova anche tu: https://simo1925.github.io/Gioco-negoziatore-/';
async function shareResult(){const data={title:'Che negoziatore sei? — Il mio risultato',text:resultText};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(resultText);shareButton.textContent='Risultato copiato!';setTimeout(()=>shareButton.textContent='Condividi il risultato',2500)}catch(e){const area=E('textarea');area.value=resultText;area.setAttribute('aria-label','Testo del risultato da copiare');area.style.width='100%';area.rows=5;shareButton.insertAdjacentElement('afterend',area);area.focus();area.select()}}
const shareButton=btn('Condividi il risultato',shareResult);app.append(p,shareButton,btn('Ricomincia',reset))}reset();
</script></body></html>
