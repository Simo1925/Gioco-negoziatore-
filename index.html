<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><meta name="description" content="Tre scenari B2B, quattro stili negoziali: scopri come prendi decisioni e confronta le tue scelte."><meta property="og:type" content="website"><meta property="og:title" content="Che negoziatore sei? | Essere Commerciale Oggi"><meta property="og:description" content="Tre scenari B2B. Quattro stili negoziali. Scopri il tuo profilo e confrontati con gli altri."><meta property="og:url" content="https://simo1925.github.io/Gioco-negoziatore-/"><meta property="og:image" content="https://simo1925.github.io/Gioco-negoziatore-/anteprima.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><title>Che negoziatore sei? | Essere Commerciale Oggi</title><style>

bottom:0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.bar{height:4px;background:#ddd;margin:20px 0 30px}.bar>div{height:100%;background:#111}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.small{font-size:13px;color:#626262}.read{border:2px solid #111;padding:18px;margin:24px 0}.read a{font-weight:800;font-size:18px;color:#111;text-decoration:underline;text-underline-offset:3px}.sharebox{border-top:1px solid #ddd;margin-top:28px;padding-top:18px}textarea{width:100%;min-height:110px;border:1px solid #aaa;padding:12px;font:inherit;line-height:1.5}footer{font-size:12px;color:#777;margin-top:50px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}#screen-title:focus{outline:none}@media(max-width:520px){header{margin-bottom:22px}main{padding:12px 14px 60px}.choice{padding:16px}.panel{padding:20px}h1{margin-top:12px}}

'use strict';
const SITE_URL='https://simo1925.github.io/Gioco-negoziatore-/';
const dims=['Tutela','Indagine','Scambio','Collaborazione'];
const profiles={
Tutela:{name:'Il Custode del valore',good:'Sai difendere confini e sostenibilità economica.',risk:'Una posizione troppo rigida può limitare il confronto.',article:'Il potere di ripensare non è un difetto',link:'https://simonebblogblog.wordpress.com/2026/11/18/il-potere-di-ripensare/'},
Indagine:{name:'L’Esploratore',good:'Fai emergere informazioni e interessi nascosti.',risk:'L’analisi può rallentare la decisione.',article:'Come Utilizzo il CRM',link:'https://simonebblogblog.wordpress.com/2026/11/09/come-utilizzo-il-crm/'},
Scambio:{name:'L’Architetto degli accordi',good:'Cerchi contropartite e vantaggi reciproci.',risk:'La ricerca di un accordo può farti trascurare ciò che il cliente considera davvero prezioso.',article:'Il vero valore?',link:'https://simonebblogblog.wordpress.com/2026/11/06/il-vero-valore/'},
Collaborazione:{name:'Il Costruttore di fiducia',good:'Coinvolgi le persone e investi nella relazione.',risk:'Potresti concedere troppo per mantenere l’armonia.',article:'Fermarsi per andare avanti',link:'https://simonebblogblog.wordpress.com/2026/11/09/fermarsi-per-andare-avanti/'},
};
const rounds=[
{title:'Il cliente ha un’offerta più bassa',story:'Un cliente B2B ti dice: «Il concorrente costa il 12% in meno. Se non ti adegui, cambiamo fornitore». Come rispondi?',opts:[
['Tutela','Spiego il valore della proposta e mantengo il prezzo.','Proteggi il margine e dai coerenza alla proposta. In cambio devi investire tempo nel dimostrare una differenza concreta.'],
['Indagine','Chiedo quali condizioni comprende l’offerta alternativa.','Scopri una differenza nei tempi di consegna. In cambio rallenti la risposta economica che il cliente si aspettava.'],
['Scambio','Valuto uno sconto in cambio di un impegno sui volumi.','Apri una trattativa sui volumi. In cambio accetti una maggiore complessità contrattuale e il rischio di concessioni.'],
['Collaborazione','Propongo un confronto per chiarire le priorità comuni.','Il cliente coinvolge il responsabile tecnico. In cambio la decisione si allunga e devi gestire più interlocutori.']]},
{title:'Un imprevisto tecnico',story:'Il team tecnico segnala un possibile aumento dei costi e dei tempi. Il cliente vuole una conferma entro domani.',opts:[
['Tutela','Comunico i vincoli e confermo solo condizioni sostenibili.','Eviti promesse che non puoi mantenere. In cambio il cliente percepisce meno flessibilità nel breve periodo.'],
['Indagine','Raccolgo i dati mancanti e verifico la natura del rischio.','Individui il componente critico. In cambio consumi parte del tempo disponibile prima della risposta.'],
['Scambio','Offro consegne per fasi in cambio di condizioni riviste.','Costruisci una soluzione negoziabile. In cambio aumentano le dipendenze e gli impegni da coordinare.'],
['Collaborazione','Riunisco cliente e tecnici per costruire un piano comune.','Le parti condividono una priorità. In cambio coinvolgere tutti richiede disponibilità e può rallentare la conferma.']]},
{title:'Il silenzio dopo l’offerta',story:'Hai inviato una proposta importante. Il cliente sembrava interessato, ma da tre settimane non risponde.',opts:[
['Tutela','Chiarisco fino a quando posso garantire prezzo e condizioni.','Definisci un confine commerciale senza forzare una decisione. In cambio il cliente può percepire una pressione sui tempi.'],
['Indagine','Chiedo quale ostacolo interno impedisce di valutare l’offerta.','Scopri che il budget non è approvato. In cambio rischi una domanda troppo diretta se la fiducia non è sufficiente.'],
['Scambio','Offro un approfondimento mirato se il cliente condivide i criteri di scelta.','Ottieni un piccolo impegno reciproco. In cambio potresti creare un altro passaggio senza accelerare la decisione.'],
['Collaborazione','Invio un caso utile per il progetto senza chiedere risposta.','Mantieni una presenza non invasiva. In cambio potresti prolungare il silenzio senza sapere se esiste ancora interesse.']]}
];
let step=0,margin=null,answers=[],orders=[],chosen=null;
const app=document.getElementById('app'),announcer=document.getElementById('announcer');
function E(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function btn(txt,fn,cls='primary'){const b=E('button',txt,cls);b.type='button';b.addEventListener('click',fn);return b}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function reset(){step=0;margin=null;answers=[];chosen=null;orders=rounds.map(r=>shuffle(r.opts));render()}
function advance(){step++;chosen=null;render()}
function base(k,title,desc){app.replaceChildren(E('div',k,'eyebrow'));const h=E('h1',title);h.id='screen-title';h.tabIndex=-1;app.append(h,E('p',desc));const bar=E('div',undefined,'bar'),fill=E('div');bar.setAttribute('role','progressbar');bar.setAttribute('aria-label','Avanzamento del gioco');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','4');bar.setAttribute('aria-valuenow',String(Math.min(4,Math.max(0,step-1))));fill.style.width=(Math.min(4,Math.max(0,step-1))/4*100)+'%';bar.append(fill);app.append(bar);requestAnimationFrame(()=>{h.focus({preventScroll:true});if(chosen===null)window.scrollTo({top:0,behavior:'instant'});announcer.textContent=k+': '+title})}
function render(){
if(step===0){base('Esperienza interattiva · 1 scelta iniziale + 3 scenari','Che negoziatore sei?','Distribuisci 100 punti e affronta tre situazioni B2B, con quattro alternative ciascuna. Ogni scelta offre un vantaggio e comporta un costo: non esistono risposte giuste in assoluto.');app.append(btn('Inizia il gioco',advance));return}
if(step===1){base('Passaggio 1 di 4 · Le tue priorità','Distribuisci 100 punti','Immagina questa situazione: stai trattando con un cliente importante che chiede uno sconto per confermare un ordine. Vuoi proteggere la redditività della vendita, ma anche mantenere una relazione solida con il cliente. Come distribuisci le tue priorità tra margine e relazione? Sposta la barra: hai 100 punti da assegnare complessivamente.');const p=E('section',undefined,'panel'),labels=E('div',undefined,'split'),left=E('span','Margine: 50'),right=E('span','Relazione: 50');labels.append(left,right);const slider=E('input');slider.type='range';slider.min='0';slider.max='100';slider.step='5';slider.value='50';slider.setAttribute('aria-label','Punti dedicati al margine, da 0 a 100');margin=50;const hint=E('p','Trascina il cursore a destra o a sinistra. Puoi anche confermare 50/50.','small');slider.addEventListener('input',()=>{margin=Number(slider.value);left.textContent='Margine: '+margin;right.textContent='Relazione: '+(100-margin)});p.append(labels,slider,hint,btn('Conferma e continua',advance));app.append(p);return}
if(step>=2&&step<=4){const idx=step-2,r=rounds[idx];base('Passaggio '+(idx+2)+' di 4 · Scenario '+(idx+1)+' di 3',r.title,r.story);if(chosen===null){const list=E('div',undefined,'choices');orders[idx].forEach(o=>list.append(btn(o[1],()=>{answers[idx]=o[0];chosen=o;render();requestAnimationFrame(()=>{const f=app.querySelector('.feedback');if(f){f.tabIndex=-1;f.scrollIntoView({behavior:'smooth',block:'center'});f.focus({preventScroll:true})}})},'choice')));app.append(list)}else{const f=E('div',undefined,'feedback');f.append(E('strong','Vantaggio e costo della tua scelta'),E('p',chosen[2]));app.append(f,btn(idx===2?'Scopri il tuo profilo':'Prosegui',advance))}return}
// Ogni scelta attribuisce 3 punti allo stile principale e 1 a quello di supporto.
// I punteggi di supporto sono definiti per scenario, senza dipendere dall'ordine casuale dei pulsanti.
const supportByRound=[{"Tutela": "Indagine", "Indagine": "Collaborazione", "Scambio": "Tutela", "Collaborazione": "Indagine"}, {"Tutela": "Scambio", "Indagine": "Tutela", "Scambio": "Collaborazione", "Collaborazione": "Indagine"}, {"Tutela": "Scambio", "Indagine": "Collaborazione", "Scambio": "Indagine", "Collaborazione": "Scambio"}];
const scores=Object.fromEntries(dims.map(d=>[d,0]));
const primaryCounts=Object.fromEntries(dims.map(d=>[d,0]));
answers.forEach((d,i)=>{scores[d]+=3;primaryCounts[d]++;scores[supportByRound[i][d]]+=1});
const ranked=[...dims].sort((a,b)=>scores[b]-scores[a]||primaryCounts[b]-primaryCounts[a]||dims.indexOf(a)-dims.indexOf(b));
const top=scores[ranked[0]];
const leaders=ranked.filter(d=>scores[d]===top&&primaryCounts[d]===primaryCounts[ranked[0]]);
const primary=ranked[0],secondary=ranked.find(d=>d!==primary);
const prof=profiles[primary];
const tied=leaders.length>1;
const relation=answers.filter(d=>['Indagine','Collaborazione'].includes(d)).length;
const protection=answers.filter(d=>d==='Tutela').length;
const neutral=3-relation-protection;
let insight='Le tue scelte usano leve diverse: non emerge una preferenza netta tra tutela del margine e relazione.';
if(relation>protection)insight=margin>=60?'Hai dichiarato di privilegiare il margine, ma negli scenari hai dato più spazio all’ascolto e alla relazione. È una differenza su cui riflettere.':'Le tue scelte danno più spazio all’ascolto e alla relazione'+(margin<=40?', in linea con la priorità iniziale.':'.');
if(protection>relation)insight=margin<=40?'Hai dichiarato di privilegiare la relazione, ma negli scenari hai soprattutto difeso il valore economico. È una differenza su cui riflettere.':'Le tue scelte difendono soprattutto il valore economico'+(margin>=60?', in linea con la priorità iniziale.':'.');
base('Il tuo risultato','Il tuo stile di negoziazione','Le tue risposte descrivono una tendenza in questi scenari, non un’etichetta definitiva.');
const p=E('section',undefined,'panel');p.append(E('span',tied?'Stili a pari merito':'Profilo prevalente','tag'),E('h2',tied?leaders.map(d=>profiles[d].name).join(' + '):prof.name));
if(tied)p.append(E('p','Due o più stili hanno lo stesso punteggio e lo stesso numero di scelte principali: non sarebbe corretto sceglierne uno arbitrariamente.'));
else p.append(E('p','Stile secondario: '+profiles[secondary].name+'. È una tendenza complementare, non un secondo profilo definitivo.'));
p.append(E('p','Punto di forza: '+prof.good),E('p','Da osservare: '+prof.risk),E('h3','Le tue scelte')); 
dims.forEach(d=>{const row=E('div',undefined,'row');row.append(E('span',d),E('strong',String(scores[d])));p.append(row)});
p.append(E('p','Punteggio: 3 punti allo stile scelto e 1 allo stile complementare della risposta. In caso di parità contano le scelte principali; se permane, mostriamo entrambi gli stili.','small'));
p.append(E('h3','Intenzione e comportamento'),E('p','All’inizio hai dichiarato: Margine '+margin+' / Relazione '+(100-margin)+'.'),E('p',insight),E('p','Negli scenari: '+relation+' scelte orientate ad ascolto/relazione, '+protection+' alla tutela del valore e '+neutral+' allo scambio. È un confronto orientativo: lo slider non modifica il profilo.','small'));
const read=E('section',undefined,'read');read.append(E('div','IL TUO ARTICOLO CONSIGLIATO','eyebrow'));const link=E('a',prof.article+' ↗');link.href=prof.link;link.target='_blank';link.rel='noopener';read.append(link,E('p','Un approfondimento dal blog Essere Commerciale Oggi, scelto in base allo stile emerso.'));p.append(read);app.append(p);
const discuss=E('section',undefined,'sharebox');discuss.append(E('h3','Confrontiamoci sulle scelte'),E('p','Quale profilo hai ottenuto? Ti riconosci nel risultato? Puoi raccontarlo nei commenti della pagina del gioco sul blog.'));
const blogComment=E('a','Commenta sul blog ↗','action');blogComment.href='https://simonebblogblog.wordpress.com/che-negoziatore-sei/#respond';blogComment.target='_blank';blogComment.rel='noopener';discuss.append(blogComment);
const linkedin=E('div',undefined,'read');linkedin.append(E('strong','Discussione su LinkedIn'),E('p','Hai scoperto il tuo profilo? Racconta il risultato e confrontati con gli altri nei commenti del post LinkedIn.'));const linkedinLink=E('a','Commenta su LinkedIn ↗','action');linkedinLink.href='https://lnkd.in/p/euQQ85mf';linkedinLink.target='_blank';linkedinLink.rel='noopener noreferrer';linkedin.append(linkedinLink);discuss.append(linkedin);
app.append(discuss,btn('Ricomincia',reset,'secondary'));
}
reset();
</script></body></html>
